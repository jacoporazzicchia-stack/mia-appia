<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><title>La mia app</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#14161c;--muted:#6b7280;--line:#e6e8ef;--a:#6366f1;--a2:#8b5cf6;--in:#10b981;--out:#f43f5e;--sh:0 8px 30px rgba(20,22,28,.07);--r:22px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--text:#f2f4f8;--muted:#9aa3b2;--line:#262a34;--sh:0 8px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--bg)}
#burger{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);color:var(--text);font-size:20px;box-shadow:var(--sh)}
#top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1}
#loc{border:0;border-radius:14px;padding:10px 13px;font-weight:700;font-size:13px;background:var(--card);color:var(--text);box-shadow:var(--sh)}
#side{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--card);z-index:20;transform:translateX(-105%);transition:transform .25s;padding:calc(22px + env(safe-area-inset-top)) 14px 20px;box-shadow:0 0 50px rgba(0,0,0,.3)}
#side.open{transform:none}
#side h2{font-size:20px;margin:0 8px 18px;font-weight:800}
#side button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;color:var(--muted);padding:14px;border-radius:16px;font-size:16px;font-weight:700;text-align:left;margin-bottom:4px}
#side button.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.4)}
#shade{position:fixed;inset:0;background:rgba(5,6,10,.5);z-index:15;display:none}
#shade.open{display:block}
@media(min-width:900px){#side{transform:none;box-shadow:var(--sh)}#shade{display:none!important}#burger{display:none}#top,main{margin-left:260px}}
main{max-width:720px;margin:0 auto;padding:6px 16px 60px}
@media(min-width:900px){main{margin-left:calc(260px + (100vw - 260px - 720px)/2)}}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.hero{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-radius:var(--r);padding:22px;margin-bottom:16px;box-shadow:0 14px 34px rgba(99,102,241,.35)}
.hero .l{opacity:.85;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero .b{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:6px 0 12px}
.row{display:flex;gap:12px}.pill{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px}
.pill span{display:block;font-size:12px;opacity:.9;font-weight:600}.pill b{font-size:17px}
h2.t{font-size:16px;margin:0 0 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:13px}.in{color:var(--in)}.out{color:var(--out)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .m{flex:1;min-width:0}.item .m b{display:block;font-size:15px}.item .m small{color:var(--muted);font-size:12px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;background:#c4c8d2}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.sm{border:0;background:var(--bg);color:var(--text);border-radius:12px;padding:9px 13px;font-weight:700;font-size:13px}
.pri{border:0;border-radius:16px;padding:14px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 8px 22px rgba(99,102,241,.35);width:100%;margin-bottom:14px}
.seg{display:flex;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:11px;font-weight:700;font-size:13px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--sh)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{width:40px;height:40px;border-radius:13px;border:0;background:var(--bg);color:var(--text);font-size:18px}
.nav strong{text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.grid .h{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.cell{background:var(--bg);border-radius:12px;padding:6px 2px;min-height:58px;font-size:12px;font-weight:700}
.cell.today{outline:2px solid var(--a)}.cell i{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:5px}
.cell i s{width:9px;height:9px;border-radius:50%;display:block}
.week .cell{min-height:80px;font-size:14px}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;color:#fff}
.mamma{background:#ec4899}.papa{background:#06b6d4}
.cl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{background:var(--bg);border-radius:18px;overflow:hidden;position:relative}
.cc img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.cc .ph{aspect-ratio:1;display:grid;place-items:center;font-size:40px}
.cc .bd{padding:10px}.cc .bd b{font-size:14px;display:block;margin-bottom:6px}
.cc .bt{display:flex;gap:6px;margin-top:8px}.cc .bt button{flex:1;border:0;border-radius:10px;padding:8px 0;background:var(--card);color:var(--text);font-weight:700;font-size:13px}
.cc .bt button.w{background:var(--in);color:#fff}
.cc .badge{position:absolute;top:8px;left:8px}
.chip{display:inline-block;background:var(--bg);padding:7px 11px;border-radius:12px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.bring{background:linear-gradient(135deg,#f59e0b,#f43f5e);color:#fff;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:13px}
.bring .chip{background:rgba(255,255,255,.22);font-size:12px;padding:5px 9px;margin:0 5px 5px 0}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:6px}.bar u{display:block;height:100%;background:var(--a)}
dialog{border:0;border-radius:26px;padding:0;width:min(440px,94vw);max-height:90vh;background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,6,10,.55);backdrop-filter:blur(4px)}
form{padding:22px}form h3{margin:0 0 16px;font-size:19px}
.f{margin-bottom:14px}.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{width:100%;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;outline:none}
.f input[type=color]{padding:3px;height:48px}.f textarea{min-height:70px}
.actions{display:flex;gap:10px}.actions button{flex:1;padding:14px;border-radius:16px;border:0;font-size:15px;font-weight:700}
.c{background:var(--bg);color:var(--text)}.d{background:var(--out);color:#fff}.s{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
.sws{display:flex;flex-wrap:wrap;gap:8px}.sw input{display:none}
.sw span,.fc{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font:600 14px inherit;font-family:inherit;cursor:pointer}
.sw input:checked+span,.fc.on{border-color:var(--a);background:rgba(99,102,241,.16)}
.sw i,.fc i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.45);display:inline-block}
.empty{text-align:center;color:var(--muted);padding:22px 0;font-size:14px}
</style></head><body>
<div id="top"><button id="burger">☰</button><h1 id="ttl"></h1><button id="loc"></button></div>
<aside id="side"><h2>✨ Menu</h2><div id="menu"></div></aside><div id="shade"></div>
<main id="main"></main><dialog id="dlg"></dialog>
<script>
(()=>{
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur=n=>new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n);
const DN=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"],DS=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const HN={mamma:"Mamma",papa:"Papà"};
const KEY="app_v1";
const TT={1:["Religione (Pepe)","Inglese (Dardo)","Matematica/Fisica (Borgognoni)","Latino/Storia (Gerunda)","Ginnastica (Iacozzilli)","Matematica/Fisica (Borgognoni)"],
2:["Arte (Di Grazia)","Scienze (Di Mauro)","Matematica/Fisica (Borgognoni)","Italiano (Ciaccio)","Italiano (Ciaccio)","Latino/Storia (Gerunda)"],
3:["Latino/Storia (Gerunda)","Latino/Storia (Gerunda)","Inglese (Dardo)","Matematica/Fisica (Borgognoni)","Matematica/Fisica (Borgognoni)","Italiano (Ciaccio)"],
4:["Arte (Di Grazia)","Scienze (Di Mauro)","Matematica/Fisica (Borgognoni)","Matematica/Fisica (Borgognoni)","Latino/Storia (Gerunda)"],
5:["Da verificare","Da verificare","Inglese (Dardo)","Latino/Storia (Gerunda)","Italiano (Ciaccio)"]};
const HR=["08:00–09:00","09:00–10:00","10:00–11:00","11:00–12:00","12:00–13:00","13:00–14:00"];
const sx=a=>a.map(x=>x+" · 4×10-12");
const WK=[{id:11,name:"Petto + Tricipiti",color:"#f43f5e",ex:sx(["Spinte con manubri su panca piana","Spinte con manubri su panca inclinata a 30°","Croci con manubri","French press con manubri"])},
{id:12,name:"Schiena + Bicipiti",color:"#6366f1",ex:sx(["Rematore manubrio","Alzate a 90° (seduto su panca)","Curl con manubri su panca inclinata (circa 60°)","Spider curl"])},
{id:13,name:"Spalle",color:"#f59e0b",ex:sx(["Alzate a Y con petto poggiato su panca inclinata","Alzate laterali da seduto","Rematore manubrio (opzionale)"])},
{id:14,name:"Richiamo",color:"#10b981",ex:sx(["Spinte con manubri su panca piana","Rematore manubrio","Alzate laterali da seduto","Spider curl","French press con manubri"])},
{id:15,name:"Personalizzata",color:"#8b5cf6",ex:[]}];
let S={workouts:[],log:{},items:[],outfit:{},tt:{1:[],2:[],3:[],4:[],5:[]},locDays:{0:"mamma",1:"mamma",2:"mamma",3:"mamma",4:"mamma",5:"papa",6:"papa"},over:{},tx:[],start:0};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
if(!S.wv){S.workouts=WK;S.wv=1}
S.workouts.forEach(w=>w.name=w.name.replace(/^Giorno \d+\s*[–-]\s*/,""));
if(!S.ttv){S.tt=TT;S.ttv=1}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Memoria piena: elimina qualche foto.")}};
const PAT=["papa","papa","papa","mamma","mamma","papa","papa","mamma","mamma","mamma","papa","papa","mamma","mamma"];
const base=d=>PAT[((Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,10,6))/864e5)%14)+14)%14];
const loc=d=>S.over[iso(d)]||base(d);
const easter=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),t=h+l-7*m+114;return new Date(y,Math.floor(t/31)-1,t%31+1)};
const FX={"1-1":"Capodanno","6-1":"Epifania","25-4":"Liberazione","1-5":"Festa del lavoro","2-6":"Festa della Repubblica","15-8":"Ferragosto","1-11":"Ognissanti","8-12":"Immacolata"};
const hol=d=>{const m=d.getMonth()+1,n=d.getDate();
  if((m===12&&n>=23)||(m===1&&n<=6))return"Vacanze di Natale";
  if(FX[n+"-"+m])return FX[n+"-"+m];
  const p=easter(d.getFullYear()),k=iso(d);if(k===iso(p))return"Pasqua";if(k===iso(addD(p,1)))return"Pasquetta";return""};
function setRange(a,b,h){for(let d=new Date(a+"T12:00");iso(d)<=b;d=addD(d,1)){if(h==="auto")delete S.over[iso(d)];else S.over[iso(d)]=h}}
function ask(){const t=new Date(),g=[];
  for(let i=0;i<30;i++){const d=addD(t,i),n=hol(d);if(!n||S.over[iso(d)])continue;const l=g[g.length-1];
    if(l&&l.n===n&&iso(addD(new Date(l.to+"T12:00"),1))===iso(d))l.to=iso(d);else g.push({n,from:iso(d),to:iso(d)})}
  const f=s=>s.split("-").reverse().slice(0,2).join("/");
  return g.map(x=>`<div class="card"><h2 class="t">🎉 ${x.n}</h2><p class="muted" style="margin:0 0 12px">${f(x.from)}${x.to!==x.from?" – "+f(x.to):""} · Dove starai?</p><div class="actions"><button class="c" data-a="hp" data-f="${x.from}" data-t="${x.to}" data-h="mamma">Mamma</button><button class="c" data-a="hp" data-f="${x.from}" data-t="${x.to}" data-h="papa">Papà</button><button class="c" data-a="pd" data-f="${x.from}" data-t="${x.to}">✎ Altro</button></div></div>`).join("")}
const period=(a,b)=>M("Periodo speciale",`<p class="muted" style="margin-top:0">Scegli dove stai in un periodo (vacanze, eccezioni). Fuori da questi giorni vale la regola normale.</p><div class="f"><label>Dal</label><input type="date" name="a" required value="${a||iso(new Date())}"></div><div class="f"><label>Al</label><input type="date" name="b" required value="${b||a||iso(new Date())}"></div><div class="f"><label>Dove stai</label><select name="h"><option value="mamma">Mamma</option><option value="papa">Papà</option><option value="auto">Regola normale (cancella eccezione)</option></select></div>`,f=>setRange(f.a.value,f.b.value,f.h.value));
const V=[["alle","🏋️","Allenamento"],["arm","👕","Armadio"],["ora","🎒","Orario"],["spe","💸","Spese"],["note","🔒","Note"]];
let view="alle",calMode="week",ref=new Date(),sm=new Date(),armF="tutti",armT="",armC="",armO=false,photo=null;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

// modal
const dlg=$("dlg");
function M(t,body,ok,del){
  dlg.innerHTML=`<form><h3>${t}</h3>${body}<div class="actions"><button type="button" class="c">Annulla</button><button class="s">Salva</button></div>${del?'<div class="actions" style="margin-top:10px"><button type="button" class="d">Elimina</button></div>':""}</form>`;
  const f=dlg.querySelector("form");
  f.querySelector(".c").onclick=()=>dlg.close();
  if(del)f.querySelector(".d").onclick=()=>C("Eliminare davvero?",del);
  f.onsubmit=e=>{e.preventDefault();ok(f.elements);dlg.close();save();render()};
  dlg.showModal();
}
function C(t,fn){
  dlg.innerHTML=`<form><h3>${t}</h3><div class="actions"><button type="button" class="c">Annulla</button><button class="d">Sì, elimina</button></div></form>`;
  const f=dlg.querySelector("form");f.querySelector(".c").onclick=()=>dlg.close();
  f.onsubmit=e=>{e.preventDefault();fn();dlg.close();save();render()};if(!dlg.open)dlg.showModal();
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});

// menu
function menu(){
  $("menu").innerHTML=V.map(v=>`<button class="${v[0]===view?"on":""}" data-a="go" data-v="${v[0]}">${v[1]} ${v[2]}</button>`).join("");
  $("ttl").textContent=V.find(v=>v[0]===view)[2];
  const l=loc(new Date());$("loc").textContent=`📍 Oggi: ${HN[l]}`;
}
const side=o=>{$("side").classList.toggle("open",o);$("shade").classList.toggle("open",o)};
$("burger").onclick=()=>side(true);$("shade").onclick=()=>side(false);
$("loc").onclick=()=>{const k=iso(new Date()),n=loc(new Date())==="mamma"?"papa":"mamma";S.over[k]=n;
  (S.outfit[k]||[]).forEach(id=>{const it=S.items.find(i=>i.id===id);if(it)it.home=n});save();render()};

// ALLENAMENTO
function dots(k){
  const l=S.log[k]||[];
  if(l.length)return`<i>${l.map(id=>{const w=S.workouts.find(x=>x.id===id);return w?`<s style="background:${w.color}"></s>`:""}).join("")}</i>`;
  return k<=iso(new Date())?`<i><s style="background:#c4c8d2"></s></i>`:"";
}
function rAlle(){
  const today=iso(new Date()),tl=S.log[today]||[];
  let h=`<div class="card"><h2 class="t">Oggi</h2>${S.workouts.length?S.workouts.map(w=>{const on=tl.includes(w.id);
    return`<div class="item" data-a="tw" data-id="${w.id}" style="cursor:pointer"><span class="dot" style="background:${w.color}"></span><div class="m"><b>${esc(w.name)}</b>${w.ex&&w.ex.length?`<small>${w.ex.length} esercizi</small>`:""}</div><div class="chk" style="${on?`background:${w.color};border-color:${w.color}`:""}">${on?"✓":""}</div></div>`}).join(""):`<div class="empty">Aggiungi il tuo primo allenamento qui sotto.</div>`}</div>`;
  let cal="";
  if(calMode==="week"){
    const mon=addD(ref,-((ref.getDay()+6)%7));
    cal=`<div class="nav"><button data-a="nav" data-n="-1">‹</button><strong>${mon.getDate()}/${mon.getMonth()+1} – ${addD(mon,6).getDate()}/${addD(mon,6).getMonth()+1}</strong><button data-a="nav" data-n="1">›</button></div><div class="grid week">`+
    Array.from({length:7},(_,i)=>{const d=addD(mon,i),k=iso(d);return`<div class="cell ${k===today?"today":""}" data-a="ed" data-d="${k}" style="cursor:pointer"><span class="muted">${DS[i]}</span><br>${d.getDate()}${dots(k)}</div>`}).join("")+`</div>`;
  }else{
    const y=ref.getFullYear(),m=ref.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
    cal=`<div class="nav"><button data-a="nav" data-n="-1">‹</button><strong>${ref.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</strong><button data-a="nav" data-n="1">›</button></div><div class="grid">`+DS.map(d=>`<div class="h">${d[0]}</div>`).join("")+Array(off).fill("<div></div>").join("")+
    Array.from({length:nd},(_,i)=>{const k=`${y}-${pad(m+1)}-${pad(i+1)}`;return`<div class="cell ${k===today?"today":""}" data-a="ed" data-d="${k}" style="cursor:pointer">${i+1}${dots(k)}</div>`}).join("")+`</div>`;
  }
  h+=`<div class="card"><h2 class="t">Calendario</h2><div class="seg"><button class="${calMode==="week"?"on":""}" data-a="cm" data-m="week">Settimana</button><button class="${calMode==="month"?"on":""}" data-a="cm" data-m="month">Mese</button></div>${cal}
  <div style="margin-top:14px">${S.workouts.map(w=>`<span class="chip"><span class="dot" style="background:${w.color};width:10px;height:10px"></span> ${esc(w.name)}</span>`).join("")}<span class="chip"><span class="dot" style="width:10px;height:10px"></span> Non mi alleno</span></div></div>`;
  h+=`<div class="card"><h2 class="t">I miei allenamenti</h2>${S.workouts.map(w=>`<div class="item"><span class="dot" style="background:${w.color}"></span><div class="m"><b>${esc(w.name)}</b>${(w.ex||[]).map(x=>`<small style="display:block">• ${esc(x)}</small>`).join("")}</div><button class="sm" data-a="ew" data-id="${w.id}">✎ Modifica</button></div>`).join("")}</div><button class="pri" data-a="ew">＋ Nuovo allenamento</button>`;
  return h;
}
function editW(id){
  const w=S.workouts.find(x=>x.id==id)||{name:"",color:"#6366f1",ex:[]};
  M(id?"Modifica allenamento":"Nuovo allenamento",`<div class="f"><label>Nome</label><input name="n" required maxlength="40" value="${esc(w.name)}" placeholder="Es. Gambe"></div><div class="f"><label>Colore del pallino</label><input type="color" name="c" value="${w.color}"></div><div class="f"><label>Esercizi (uno per riga)</label><textarea name="x" style="min-height:150px" placeholder="Es. Squat · 4×10">${esc((w.ex||[]).join("\n"))}</textarea></div>`,
  f=>{const ex=f.x.value.split("\n").map(t=>t.trim()).filter(Boolean);
    if(id){w.name=f.n.value.trim();w.color=f.c.value;w.ex=ex}else S.workouts.push({id:Date.now(),name:f.n.value.trim(),color:f.c.value,ex})},
  id?()=>{S.workouts=S.workouts.filter(x=>x.id!=id);for(const k in S.log)S.log[k]=S.log[k].filter(x=>x!=id)}:null);
}

// ARMADIO
function rArm(){
  const t=iso(new Date()),worn=S.outfit[t]||[],l=loc(new Date());
  const list=S.items.filter(i=>(armF==="tutti"||i.home===armF)&&(!armT||i.type===armT)&&(!armC||i.color===armC));
  const wornItems=S.items.filter(i=>worn.includes(i.id));
  let h=ask()+`<div class="hero"><div class="l">Oggi sono da</div><div class="b">${HN[l]}</div><div class="row"><div class="pill"><span>👕 Indosso</span><b>${wornItems.length?wornItems.map(i=>esc(i.name)).join(", "):"Niente segnato"}</b></div></div></div>
  <div class="seg">${[["tutti","Tutti"],["mamma","Mamma"],["papa","Papà"]].map(x=>`<button class="${armF===x[0]?"on":""}" data-a="af" data-f="${x[0]}">${x[1]}</button>`).join("")}</div>
  ${filt()}<button class="pri" data-a="ai">📷 Aggiungi vestito</button>`;
  h+=list.length?`<div class="cl">${list.map(i=>`<div class="cc"><span class="badge ${i.home}">${HN[i.home]}</span>${i.photo?`<img src="${i.photo}">`:`<div class="ph">${TE[i.type]||"👕"}</div>`}<div class="bd"><b>${esc(i.name)}</b>${i.type?`<small class="muted" style="display:block;margin:-2px 0 4px"><span class="dot" style="background:${CL[i.color]||"#c4c8d2"};width:10px;height:10px;border:1px solid var(--line)"></span> ${esc(i.type)} · ${esc(i.color)}</small>`:""}<div class="bt"><button class="${worn.includes(i.id)?"w":""}" data-a="wear" data-id="${i.id}">${worn.includes(i.id)?"✓ Addosso":"Indosso"}</button><button data-a="mv" data-id="${i.id}" title="Sposta">⇄</button><button data-a="ei" data-id="${i.id}">✏️</button></div></div></div>`).join("")}</div>`:`<div class="card empty">Nessun vestito. Premi “Aggiungi vestito” per fotografarne uno.</div>`;
  return h+`<p class="muted">Quando segni un vestito come “Indosso”, l'app lo mette nella casa dove sei oggi.</p>`;
}
const CL={Nero:"#1f2937",Bianco:"#ffffff",Grigio:"#9ca3af",Blu:"#2563eb",Azzurro:"#7dd3fc",Rosso:"#ef4444",Rosa:"#f9a8d4",Verde:"#22c55e",Giallo:"#facc15",Arancione:"#fb923c",Viola:"#a855f7",Marrone:"#92400e",Beige:"#e7d3b0",Altro:"#c4c8d2"};
const TE={Giacca:"🧥",Felpa:"👕",Maglia:"👕",Pantalone:"👖",Scarpe:"👟",Accessorio:"🧢",Altro:"👚"};
function filt(){
  const n=(armT?1:0)+(armC?1:0);
  return `<button class="sm" style="width:100%;margin-bottom:12px;padding:12px;background:var(--card);box-shadow:var(--sh)" data-a="fo">🎛️ Filtri${n?` (${n} attivi)`:""} ${armO?"▲":"▼"}</button>`+(armO?`<div class="card"><h2 class="t">Tipo di capo</h2><div class="sws">${["",...Object.keys(TE)].map(k=>`<button class="fc ${armT===k?"on":""}" data-a="ft" data-v="${k}">${k?TE[k]+" "+k:"Tutti"}</button>`).join("")}</div><h2 class="t" style="margin-top:16px">Colore</h2><div class="sws">${["",...Object.keys(CL)].map(k=>`<button class="fc ${armC===k?"on":""}" data-a="fc" data-v="${k}">${k?`<i style="background:${CL[k]}"></i>${k}`:"Tutti"}</button>`).join("")}</div></div>`:"");
}
function itemDlg(id){
  const it=S.items.find(x=>x.id==id)||null;photo=it?it.photo:null;
  const t0=it&&it.type||"Felpa",k0=it&&it.color||"Nero";
  const auto=it&&it.type&&it.name===it.type+" "+String(it.color).toLowerCase();
  const chips=(nm,obj,cur,fn)=>`<div class="sws">${Object.keys(obj).map(k=>`<label class="sw"><input type="radio" name="${nm}" value="${k}" ${k===cur?"checked":""}><span>${fn(k)}</span></label>`).join("")}</div>`;
  M(it?"Modifica vestito":"Nuovo vestito",
  `<div class="f"><label>Foto</label>${photo?`<img src="${photo}" style="width:90px;height:90px;object-fit:cover;border-radius:14px;display:block;margin-bottom:8px">`:""}<input type="file" id="ph" accept="image/*"></div>
  <div class="f"><label>Che cos'è?</label>${chips("t",TE,t0,k=>TE[k]+" "+k)}</div>
  <div class="f"><label>Colore</label>${chips("k",CL,k0,k=>`<i style="background:${CL[k]}"></i>${k}`)}</div>
  <div class="f"><label>Nome (facoltativo)</label><input name="n" maxlength="30" value="${esc(it&&!auto?it.name:"")}" placeholder="Es. Felpa con cappuccio"></div>
  <div class="f"><label>Dove sta</label><select name="h"><option value="mamma">Mamma</option><option value="papa" ${it&&it.home==="papa"?"selected":""}>Papà</option></select></div>`,
  f=>{const d={type:f.t.value,color:f.k.value,name:f.n.value.trim()||f.t.value+" "+f.k.value.toLowerCase(),home:f.h.value,photo};if(it)Object.assign(it,d);else S.items.push({id:Date.now(),...d})},
  it?()=>{S.items=S.items.filter(x=>x.id!=id);for(const k in S.outfit)S.outfit[k]=S.outfit[k].filter(x=>x!=id)}:null);
  $("ph").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.65)};im.src=r.result};r.readAsDataURL(fl)};
}
// ORARIO
const subj=x=>{const m=/^(.*?)\s*\((.*)\)$/.exec(x);return m?[m[1],m[2]]:[x,""]};
function bring(d){
  const l=loc(d);let j=1;while(j<=14&&loc(addD(d,j))===l)j++;if(j>14)return"";
  const o=loc(addD(d,j)),days=[];
  for(let k=j;k<=j+14&&loc(addD(d,k))===o;k++){const x=addD(d,k),w=x.getDay();
    if(w>0&&w<6){const b=[...new Set((S.tt[w]||[]).map(t=>subj(t)[0]).filter(t=>t&&t!=="Da verificare"))];if(b.length)days.push([DN[w],b])}}
  return days.length?`<div class="bring">📚 <b>Da portare da ${HN[o]}</b>${days.map(([n,b])=>`<div style="margin-top:8px"><b>${n}</b><br>${b.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`).join("")}</div>`:"";
}
function rOra(){
  const today=new Date();let h=ask()+`<button class="pri" data-a="eo">✎ Modifica orario</button><button class="pri" data-a="pd">📅 Periodo speciale (vacanze, eccezioni)</button>`,n=0;
  for(let i=0;i<10&&n<5;i++){
    const d=addD(today,i),w=d.getDay();if(w===0||w===6)continue;
    const first=n===0,l=loc(d),t=S.tt[w]||[];n++;
    const title=`<h2 class="t"><span>${i===0?"Oggi · ":i===1?"Domani · ":""}${DN[w]} ${d.getDate()}/${d.getMonth()+1}${hol(d)?" 🎉":""}</span><span class="badge ${l}">${HN[l]}</span></h2>`;
    if(first)h+=`<div class="card" style="border:2px solid var(--a)">${title}${t.length?t.map((x,k)=>{const[a,b]=subj(x);return`<div class="item"><div class="muted" style="width:92px;font-weight:700">${HR[k]}</div><div class="m"><b>${esc(a)}</b>${b?`<small>${esc(b)}</small>`:""}</div></div>`}).join(""):`<div class="muted">Orario non inserito</div>`}${bring(today)}</div>`;
    else h+=`<div class="card">${title}${t.length?t.map((x,k)=>`<span class="chip">${k+1}ª ${esc(subj(x)[0])}</span>`).join(""):`<div class="muted">Orario non inserito</div>`}${bring(d)}</div>`;
  }
  return h;
}
function editOra(){
  const lo=`<option value="mamma">Mamma</option><option value="papa">Papà</option>`;
  const body=`<p class="muted" style="margin-top:0">Una materia per riga, in ordine di ora. Formato: Materia (Prof)</p>`+[1,2,3,4,5].map(d=>`<div class="f"><label>${DN[d]}</label><textarea name="t${d}">${esc((S.tt[d]||[]).join("\n"))}</textarea></div>`).join("");
  M("Orario",body,f=>{for(let d=1;d<=5;d++)S.tt[d]=f["t"+d].value.split("\n").map(s=>s.trim()).filter(Boolean)});
}

// SPESE
const CO=["🍽️ Cibo","🏠 Casa","🚗 Trasporti","🎉 Svago","🛍️ Shopping","💊 Salute","💡 Bollette","📦 Altro"],CI=["💼 Paghetta","🎁 Regalo","🏷️ Vendita","💰 Altro"];
function rSpe(){
  const mk=`${sm.getFullYear()}-${pad(sm.getMonth()+1)}-`,list=S.tx.filter(t=>t.date.startsWith(mk)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);
  const i=sum(list,"in"),o=sum(list,"out"),tot=S.start+sum(S.tx,"in")-sum(S.tx,"out");
  const bc={};list.filter(t=>t.type==="out").forEach(t=>bc[t.cat]=(bc[t.cat]||0)+t.amount);
  let h=`<div class="hero"><div class="l">Saldo generale</div><div class="b">${eur(tot)}</div><button class="sm" style="background:rgba(255,255,255,.2);color:#fff;margin-bottom:12px" data-a="st">✎ Soldi di partenza: ${eur(S.start)}</button>
  <div class="row"><div class="pill" style="background:#10b981"><span>⬇ Entrate mese</span><b>${eur(i)}</b></div><div class="pill" style="background:#f43f5e"><span>⬆ Spese mese</span><b>${eur(o)}</b></div></div></div>
  <button class="pri" data-a="at">＋ Nuovo movimento</button>
  <div class="nav"><button data-a="sn" data-n="-1">‹</button><strong>${sm.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}</strong><button data-a="sn" data-n="1">›</button></div>`;
  const ce=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
  if(ce.length)h+=`<div class="card"><h2 class="t">Spese per categoria</h2>${ce.map(([c,v])=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between;font-size:14px"><span>${esc(c)}</span><b>${eur(v)}</b></div><div class="bar"><u style="width:${v/o*100}%"></u></div></div>`).join("")}</div>`;
  h+=`<div class="card"><h2 class="t">Movimenti</h2>${list.length?list.map(t=>`<div class="item"><div class="m"><b>${esc(t.note||t.cat)}</b><small>${t.date.split("-").reverse().join("/")} · ${esc(t.cat)}</small></div><b class="${t.type}">${t.type==="in"?"+":"−"}${eur(t.amount)}</b><button class="sm" data-a="dt" data-id="${t.id}">✕</button></div>`).join(""):`<div class="empty">Nessun movimento in questo mese.</div>`}</div>`;
  return h;
}
function addTx(){
  M("Nuovo movimento",`<div class="f"><label>Importo (€)</label><input name="a" type="number" inputmode="decimal" step="0.01" min="0.01" required placeholder="0,00" style="font-size:28px;font-weight:800;text-align:center"></div>
  <div class="f"><label>Categoria</label><select name="c"><optgroup label="Spese">${CO.map(c=>`<option value="out|${c}">${c}</option>`).join("")}</optgroup><optgroup label="Guadagni">${CI.map(c=>`<option value="in|${c}">${c}</option>`).join("")}</optgroup></select></div>
  <div class="f"><label>Descrizione (facoltativa)</label><input name="n" maxlength="60"></div><div class="f"><label>Data</label><input name="d" type="date" required value="${iso(new Date())}"></div>`,
  f=>{const[t,c]=f.c.value.split("|");S.tx.push({id:Date.now(),type:t,cat:c,amount:Math.round(parseFloat(f.a.value)*100)/100,note:f.n.value.trim(),date:f.d.value})});
}

// NOTE (cifrate con il PIN)
const NK="app_v1_n";let N={key:null,salt:null,notes:[],err:""};
const b64=u=>{let t="";new Uint8Array(u).forEach(c=>t+=String.fromCharCode(c));return btoa(t)},ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derive(pin,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function saveN(){const iv=crypto.getRandomValues(new Uint8Array(12)),d=await crypto.subtle.encrypt({name:"AES-GCM",iv},N.key,new TextEncoder().encode(JSON.stringify(N.notes)));localStorage.setItem(NK,JSON.stringify({s:b64(N.salt),i:b64(iv),d:b64(d)}))}
async function unlock(pin){try{const o=JSON.parse(localStorage.getItem(NK)),salt=ub(o.s),key=await derive(pin,salt),p=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},key,ub(o.d));N.notes=JSON.parse(new TextDecoder().decode(p));N.key=key;N.salt=salt;N.err=""}catch(e){N.err="PIN errato"}}
async function setupPin(pin){N.salt=crypto.getRandomValues(new Uint8Array(16));N.key=await derive(pin,N.salt);N.notes=[];N.err="";await saveN()}
function lockN(){N.key=null;N.notes=[];N.err=""}
function rNote(){
  if(!(window.crypto&&crypto.subtle))return`<div class="card empty">Questo browser non supporta la cifratura. Apri l'app da un indirizzo https (GitHub Pages).</div>`;
  if(!N.key){
    const has=!!localStorage.getItem(NK),err=N.err?`<p class="out" style="font-weight:700;margin:0 0 12px">${N.err}</p>`:"";
    return has?`<div class="card"><h2 class="t">🔒 Note private</h2><div class="f"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" style="text-align:center;font-size:24px;letter-spacing:.3em"></div>${err}<button class="pri" data-a="nu">Sblocca</button><button class="sm" data-a="nf">Ho dimenticato il PIN</button></div>`
    :`<div class="card"><h2 class="t">🔒 Crea il tuo PIN</h2><p class="muted" style="margin-top:0">Le note vengono cifrate con il PIN (4–8 cifre). Se lo dimentichi non si possono recuperare.</p><div class="f"><label>Nuovo PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8"></div><div class="f"><label>Ripeti PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="8"></div>${err}<button class="pri" data-a="ns">Crea PIN</button></div>`;
  }
  const l=N.notes.slice().sort((a,b)=>b.id-a.id);
  return`<div class="row" style="margin-bottom:14px"><button class="sm" style="flex:1;padding:12px" data-a="nl">🔒 Blocca</button><button class="sm" style="flex:1;padding:12px" data-a="np">Cambia PIN</button></div><button class="pri" data-a="en">＋ Nuova nota</button>`+
  (l.length?l.map(n=>`<div class="card" data-a="en" data-id="${n.id}" style="cursor:pointer"><h2 class="t" style="margin-bottom:6px"><span>${esc(n.title||"Senza titolo")}</span><span class="muted">${n.date.split("-").reverse().join("/")}</span></h2><div style="color:var(--muted);font-size:14px;white-space:pre-wrap;max-height:4.2em;overflow:hidden">${esc(n.text)}</div></div>`).join(""):`<div class="card empty">Nessuna nota. Premi “Nuova nota”.</div>`);
}
function noteDlg(id){
  const n=N.notes.find(x=>x.id==id)||null;
  M(n?"Modifica nota":"Nuova nota",`<div class="f"><label>Titolo</label><input name="t" maxlength="60" value="${esc(n?n.title:"")}"></div><div class="f"><label>Nota</label><textarea name="x" style="min-height:220px">${esc(n?n.text:"")}</textarea></div>`,
  f=>{const d={title:f.t.value.trim(),text:f.x.value,date:iso(new Date())};if(n)Object.assign(n,d);else N.notes.push({id:Date.now(),...d});saveN()},
  n?()=>{N.notes=N.notes.filter(x=>x.id!=id);saveN()}:null);
}
function dayDlg(k){
  const [y,m,d]=k.split("-").map(Number),cur=S.log[k]||[];
  const lb=new Date(y,m-1,d).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  M(lb,`<p class="muted" style="margin-top:0">Segna cosa hai fatto quel giorno.</p><div class="sws" style="flex-direction:column">${S.workouts.map(w=>`<label class="sw"><input type="checkbox" name="w" value="${w.id}" ${cur.includes(w.id)?"checked":""}><span style="width:100%"><i style="background:${w.color}"></i>${esc(w.name)}</span></label>`).join("")||'<div class="empty">Nessun allenamento creato.</div>'}</div><div style="height:16px"></div>`,
  ()=>{const ids=[...dlg.querySelectorAll('input[name=w]:checked')].map(x=>+x.value);if(ids.length)S.log[k]=ids;else delete S.log[k]});
}
// events
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==="go"){if(b.dataset.v!=="note")lockN();view=b.dataset.v;side(false);render();window.scrollTo(0,0)}
  else if(a==="tw"){const k=iso(new Date()),l=S.log[k]||[];S.log[k]=l.includes(+id)?l.filter(x=>x!==+id):[...l,+id];save();render()}
  else if(a==="nav"){const n=+b.dataset.n;if(calMode==="week")ref=addD(ref,7*n);else{ref=new Date(ref.getFullYear(),ref.getMonth()+n,1)}render()}
  else if(a==="cm"){calMode=b.dataset.m;ref=new Date();render()}
  else if(a==="ew")editW(id);
  else if(a==="ed")dayDlg(b.dataset.d);
  else if(a==="af"){armF=b.dataset.f;render()}
  else if(a==="ai"||a==="ei")itemDlg(id);
  else if(a==="fo"){armO=!armO;render()}
  else if(a==="ft"){armT=b.dataset.v;render()}
  else if(a==="fc"){armC=b.dataset.v;render()}
  else if(a==="wear"){const k=iso(new Date()),w=S.outfit[k]||[],it=S.items.find(i=>i.id==id);
    if(w.includes(+id))S.outfit[k]=w.filter(x=>x!==+id);else{S.outfit[k]=[...w,+id];it.home=loc(new Date())}save();render()}
  else if(a==="mv"){const it=S.items.find(i=>i.id==id);it.home=it.home==="mamma"?"papa":"mamma";save();render()}
  
  else if(a==="eo")editOra();
  else if(a==="hp"){setRange(b.dataset.f,b.dataset.t,b.dataset.h);save();render()}
  else if(a==="pd")period(b.dataset.f,b.dataset.t);
  else if(a==="nu")unlock($("pin").value).then(render);
  else if(a==="ns"){const p=$("pin").value;if(!/^\d{4,8}$/.test(p)){N.err="Il PIN deve avere da 4 a 8 cifre";render()}else if(p!==$("pin2").value){N.err="I PIN non coincidono";render()}else setupPin(p).then(render)}
  else if(a==="nf")C("Eliminare tutte le note e creare un nuovo PIN?",()=>{localStorage.removeItem(NK);lockN()});
  else if(a==="nl"){lockN();render()}
  else if(a==="np")M("Cambia PIN",`<div class="f"><label>Nuovo PIN (4–8 cifre)</label><input name="p" type="password" inputmode="numeric" minlength="4" maxlength="8" required></div>`,f=>{const salt=crypto.getRandomValues(new Uint8Array(16));derive(f.p.value,salt).then(k=>{N.key=k;N.salt=salt;return saveN()})});
  else if(a==="en")noteDlg(id);
  else if(a==="at")addTx();
  else if(a==="sn"){sm=new Date(sm.getFullYear(),sm.getMonth()+ +b.dataset.n,1);render()}
  else if(a==="dt")C("Eliminare questo movimento?",()=>{S.tx=S.tx.filter(t=>t.id!=id)});
  else if(a==="st")M("Soldi di partenza",`<div class="f"><label>Quanto hai adesso (€)</label><input name="v" type="number" step="0.01" required value="${S.start||""}"></div>`,f=>S.start=Math.round(parseFloat(f.v.value)*100)/100||0);
});
function render(){menu();$("main").innerHTML={alle:rAlle,arm:rArm,ora:rOra,spe:rSpe,note:rNote}[view]()}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("pin")){const b=document.querySelector('[data-a="nu"],[data-a="ns"]');if(b)b.click()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&N.key){lockN();if(view==="note")render()}});
render();
})();
</script></body></html>
